<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AI Engineering from Scratch — Türkçe</title>
  <desc id="desc">Türkçe yapay zeka mühendisliği eğitim programı başlığı</desc>

  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090d18"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e30a17"/>
      <stop offset="1" stop-color="#ff4d57"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
    </pattern>
  </defs>

  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="357" rx="22.5" fill="none" stroke="#ffffff" stroke-opacity=".12" stroke-width="3"/>

  <g transform="translate(82 78)">
    <rect width="92" height="92" rx="22" fill="url(#accent)"/>
    <circle cx="42" cy="46" r="25" fill="#fff"/>
    <circle cx="50" cy="42" r="21" fill="#e30a17"/>
    <path d="M68 35.5l3.1 6.3 7 .9-5.1 4.9 1.3 6.9-6.3-3.3-6.2 3.3 1.2-6.9-5-4.9 6.9-.9z" fill="#fff"/>
  </g>

  <g font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="204" y="109" fill="#94a3b8" font-size="18" font-weight="650" letter-spacing="4">AÇIK KAYNAK MÜFREDAT</text>
    <text x="204" y="160" fill="#f8fafc" font-size="48" font-weight="800" letter-spacing="-1.5">AI Engineering from Scratch</text>

    <rect x="82" y="220" width="1036" height="2" rx="1" fill="#ffffff" opacity=".1"/>
    <text x="82" y="287" fill="url(#accent)" font-size="52" font-weight="850" letter-spacing="8">TÜRKÇE</text>
    <text x="356" y="284" fill="#cbd5e1" font-size="22" font-weight="500" letter-spacing=".5">Sıfırdan üretime, uçtan uca yapay zeka mühendisliği</text>
  </g>

</svg>
